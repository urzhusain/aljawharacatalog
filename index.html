<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Al Jawhara · Item Catalogue</title>
<meta name="description" content="Search or scan any Al Jawhara label to see the item photo and price.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Al Jawhara">
<meta property="og:title" content="Al Jawhara · Item Catalogue">
<meta property="og:description" content="Search or scan any label to see the photo and price. Jori · Rida · Jhabla Izaar">
<meta property="og:url" content="https://urzhusain.github.io/aljawharacatalog/">
<meta property="og:image" content="https://urzhusain.github.io/aljawharacatalog/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://urzhusain.github.io/aljawharacatalog/og.jpg">
<meta name="theme-color" content="#7a4e24">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --ink:#1d2433; --muted:#6b7385; --line:#e6e2da; --bg:#faf8f4; --card:#fff;
    --accent:#8a5a2b; --accent-ink:#fff; --ok:#1f7a4d; --warn:#b4471f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(250,248,244,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 16px 12px}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .brand b{font-size:19px;letter-spacing:.3px}
  .brand span{color:var(--muted);font-size:13px}
  .bar{display:flex;gap:8px}
  .search{flex:1;position:relative}
  .search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;
    padding:0 40px 0 14px;font-size:16px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,90,43,.15)}
  .clear{position:absolute;right:6px;top:7px;width:32px;height:32px;border:0;background:none;
    color:var(--muted);font-size:20px;display:none;cursor:pointer}
  .scan{height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);
    font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer}
  .chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
    font-size:13px;color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:14px 12px 40px;max-width:1100px;margin:0 auto}
  .count{color:var(--muted);font-size:13px;margin:0 4px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
  .ph{aspect-ratio:1/1;background:#f1eee8;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .nophoto{color:var(--muted);font-size:12px;text-align:center;padding:10px}
  .meta{padding:9px 10px 11px}
  .nm{font-size:13.5px;font-weight:600;line-height:1.25;word-break:break-word}
  .pr{margin-top:4px;font-size:14px;color:var(--accent);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  /* detail sheet */
  .sheet{position:fixed;inset:0;background:rgba(20,22,30,.55);display:none;z-index:20;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;
    padding-bottom:env(safe-area-inset-bottom)}
  @media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
  .panel .big{background:#f1eee8;display:flex;justify-content:center}
  .panel .big img{max-width:100%;max-height:62vh;display:block}
  .panel .info{padding:14px 18px 18px}
  .panel h2{margin:0;font-size:20px;line-height:1.25}
  .panel .p{font-size:22px;font-weight:800;color:var(--accent);margin-top:6px}
  .panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
  .tag{border:1px solid var(--line);border-radius:8px;padding:3px 8px}
  .panel .actions{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* scanner */
  .scanner{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
  .scanner.open{display:flex}
  .scanner .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;padding-top:max(14px,env(safe-area-inset-top))}
  .scanner .top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:15px}
  #reader{flex:1;width:100%;overflow:hidden}
  #reader video{object-fit:cover}
  .hint{color:#ddd;text-align:center;font-size:14px;padding:14px 16px max(18px,env(safe-area-inset-bottom))}
  .photobtn{margin-top:10px;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--warn);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand"><b>AL JAWHARA</b><span>Item catalogue</span></div>
  <div class="bar">
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Name or code, e.g. 5107" aria-label="Search items">
      <button class="clear" id="clear" aria-label="Clear">×</button>
    </div>
    <button class="scan" id="scanBtn" aria-label="Scan barcode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>
      Scan
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No item found. Check the spelling, or try only the code (e.g. 2137).</div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel" id="panel"></div>
</div>

<div class="scanner" id="scanner">
  <div class="top"><b>Scan label</b><button id="closeScan">Close</button></div>
  <div id="reader"></div>
  <div class="hint">Fill the box with the barcode, about 10–15 cm away. Hold steady.<br>
    <button id="photoScan" class="photobtn">Not scanning? Take a photo instead</button></div>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="fileReader" style="display:none"></div>
<div class="toast" id="toast"></div>

<script src="js/html5-qrcode.min.js"></script>
<script>
(function(){
  var ITEMS=[], byKey={}, cat="All";
  var CATS=["All","Jori","Rida","Panel Rida","Jhabla","Others"];
  var $=function(id){return document.getElementById(id)};
  var norm=function(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")};
  var money=function(n){return "₹"+Number(n).toLocaleString("en-IN")};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  function toast(msg){var t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},3200)}

  function chips(){
    $("chips").innerHTML=CATS.map(function(c){return '<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>'}).join("");
  }
  $("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;chips();render()});

  function match(it,q){
    if(!q) return true;
    var words=q.toLowerCase().split(/\s+/).filter(Boolean);
    var hay=norm(it.name)+" "+norm(it.sku);
    return words.every(function(w){return hay.indexOf(norm(w))>-1});
  }

  function render(){
    var q=$("q").value.trim();
    $("clear").style.display=q?"block":"none";
    var list=ITEMS.filter(function(it){return (cat==="All"||it.cat===cat)&&match(it,q)});
    $("count").textContent=list.length+" item"+(list.length===1?"":"s");
    $("empty").hidden=list.length>0;
    var html="", max=Math.min(list.length,240);
    for(var i=0;i<max;i++){var it=list[i];
      html+='<button class="card" data-k="'+esc(it.sku)+'"><div class="ph">'+
        (it.img?'<img loading="lazy" src="'+it.img+'" alt="'+esc(it.name)+'">':'<div class="nophoto">No photo yet</div>')+
        '</div><div class="meta"><div class="nm">'+esc(it.name)+'</div><div class="pr">'+money(it.price)+'</div></div></button>';
    }
    $("grid").innerHTML=html;
    if(list.length>max) $("count").textContent+=" · showing first "+max+", type to narrow down";
  }

  function open(it){
    $("panel").innerHTML=
      '<div class="big">'+(it.img?'<img src="'+it.img+'" alt="'+esc(it.name)+'">':'<div class="nophoto" style="padding:60px">No photo yet</div>')+'</div>'+
      '<div class="info"><h2>'+esc(it.name)+'</h2><div class="p">'+money(it.price)+'</div>'+
      '<div class="row"><span class="tag">'+esc(it.cat)+'</span>'+(it.sku!==it.name?'<span class="tag">SKU '+esc(it.sku)+'</span>':'')+'</div>'+
      '<div class="actions"><button class="btn" id="closeSheet">Close</button><button class="btn primary" id="scanNext">Scan next</button></div></div>';
    $("sheet").classList.add("open");
    $("closeSheet").onclick=closeSheet;
    $("scanNext").onclick=function(){closeSheet();startScan()};
  }
  function closeSheet(){$("sheet").classList.remove("open")}
  $("sheet").addEventListener("click",function(e){if(e.target===this)closeSheet()});
  $("grid").addEventListener("click",function(e){var c=e.target.closest(".card");if(c){var it=byKey[norm(c.dataset.k)];if(it)open(it)}});

  $("q").addEventListener("input",render);
  $("q").addEventListener("keydown",function(e){
    if(e.key==="Enter"){var it=find($("q").value);if(it){open(it);$("q").blur()}}
  });
  $("clear").onclick=function(){$("q").value="";render();$("q").focus()};

  function find(text){
    var k=norm(text); if(!k) return null;
    if(byKey[k]) return byKey[k];
    var hits=ITEMS.filter(function(it){return match(it,text)});
    return hits.length===1?hits[0]:null;
  }

  // ---------- scanner ----------
  var scanner=null, busy=false;
  function fmts(){var F=Html5QrcodeSupportedFormats;return [F.CODE_128,F.CODE_39,F.EAN_13,F.QR_CODE]}
  function handle(text){
    var it=find(text);
    if(it){ $("q").value=it.name; render(); open(it); if(navigator.vibrate)navigator.vibrate(60); }
    else { $("q").value=text; render(); toast("No item with this barcode: "+text); }
  }
  function startScan(){
    if(!window.Html5Qrcode){toast("Scanner could not load. Type the code instead.");return}
    $("scanner").classList.add("open"); busy=false;
    scanner=new Html5Qrcode("reader",{formatsToSupport:fmts(),verbose:false,
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    var cfg={fps:15,
      qrbox:function(vw,vh){var w=Math.floor(Math.min(vw*0.92,700));return {width:w,height:Math.floor(Math.min(vh*0.5,w*0.5))}},
      videoConstraints:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}};
    var onOk=function(text){ if(busy) return; busy=true; stopScan().then(function(){handle(text)}); };
    scanner.start({facingMode:"environment"},cfg,onOk,function(){})
    .then(function(){
      // ask for continuous autofocus where supported (Android)
      try{var tr=scanner.getRunningTrackCameraCapabilities&&scanner.getRunningTrackCameraCapabilities();
        var t=document.querySelector("#reader video");var tk=t&&t.srcObject&&t.srcObject.getVideoTracks()[0];
        if(tk&&tk.getCapabilities&&(tk.getCapabilities().focusMode||[]).indexOf("continuous")>-1){tk.applyConstraints({advanced:[{focusMode:"continuous"}]})}}catch(e){}
    })
    .catch(function(){
      // retry with plain settings (older phones / in-app browsers)
      var s2=new Html5Qrcode("reader",{formatsToSupport:fmts(),verbose:false});
      scanner=s2;
      s2.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:140}},onOk,function(){})
      .catch(function(){ stopScan(); toast("Camera blocked. Open the link in Safari/Chrome, or use 'Take a photo'."); });
    });
  }
  // photo fallback: full-resolution still image is far easier to read than live video
  $("photoScan").onclick=function(){ stopScan().then(function(){ $("photoInput").click(); }); };
  $("photoInput").onchange=function(){
    var f=this.files&&this.files[0]; this.value=""; if(!f) return;
    toast("Reading barcode…");
    var r=new Html5Qrcode("fileReader",{formatsToSupport:fmts(),verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    r.scanFile(f,false).then(function(text){ $("toast").style.display="none"; handle(text); })
     .catch(function(){ toast("Couldn't read it. Take the photo closer, with only one label in view."); })
     .then(function(){try{r.clear()}catch(e){}});
  };
  function stopScan(){
    $("scanner").classList.remove("open");
    if(!scanner) return Promise.resolve();
    var s=scanner; scanner=null;
    return s.stop().catch(function(){}).then(function(){try{s.clear()}catch(e){}});
  }
  $("scanBtn").onclick=startScan;
  $("closeScan").onclick=function(){stopScan()};

  // ---------- load ----------
  fetch("items.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){
    ITEMS=d; d.forEach(function(it){byKey[norm(it.sku)]=it;byKey[norm(it.name)]=it});
    chips();
    var p=new URLSearchParams(location.search).get("q");
    if(p){$("q").value=p;}
    render();
    if(p){var it=find(p);if(it)open(it)}
  }).catch(function(){ $("count").textContent="Could not load items. Check your internet and reload."; });
})();
</script>
</body>
</html>
